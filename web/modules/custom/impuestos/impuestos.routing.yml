impuestos.add_form:
  path: '/admin/impuestos/add'
  defaults:
    _entity_form: 'impuestos.add'
    _title: 'Añadir Impuesto'
  requirements:
    _permission: 'impuestos.add'

impuestos.edit_form:
  path: '/admin/impuestos/{impuestos}/edit'
  defaults:
    _entity_form: 'impuestos.edit'
    _title: 'Editar Impuesto'
  requirements:
    _permission: 'impuestos.update'

impuestos.delete_form:
  path: '/admin/impuestos/{impuestos}/delete'
  defaults:
    _entity_form: 'impuestos.delete'
    _title: 'Eliminar Impuesto'
  requirements:
    _permission: 'impuestos.delete'

entity.impuestos.canonical:
  path: '/admin/impuestos/{impuestos}'
  defaults:
    _entity_view: 'impuestos.full'
    _title: 'Visualizar Impuesto'
  requirements:
    _permission: 'impuestos.view'

entity.impuestos.collection:
  path: '/admin/impuestos'
  defaults:
    _entity_list: 'impuestos'
    _title: 'Lista de Impuestos'
  requirements:
    _permission: 'impuestos.view'
